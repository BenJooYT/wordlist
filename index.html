<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magyar → English vocab trainer</title>
  <meta name="description" content="Study Hungarian to English vocab: books → units → flashcards + 20-words-in-5-minutes HU→EN typing sprint. Static site, works on GitHub Pages." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flag-bar" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="wrap">
    <header>
      <h1>Magyar → English trainer</h1>
      <p>Pick a book → a unit → drill with flashcards or the 20-in-5:00 sprint (HU shown, type the EN).</p>
    </header>

    <main>
      <section id="view-dashboard" aria-label="Books"></section>

      <section id="view-book" aria-label="Units" hidden></section>

      <section id="view-study" aria-label="Study" hidden>
        <button class="back" id="study-back">‹ <span id="back-to-book-label">Units</span></button>
        <h2 id="study-title" style="margin:0 0 8px"></h2>
        <nav class="tabs" aria-label="Modes">
          <button class="tab" data-mode="flash" aria-selected="true">🗂 Flashcards</button>
          <button class="tab" data-mode="sprint" aria-selected="false">⏱ 20 in 5:00</button>
        </nav>
        <section id="flash-view" aria-label="Flashcards"></section>
        <section id="sprint-view" aria-label="Typing sprint" hidden></section>
      </section>
    </main>

    <footer>
      <a class="credit" href="https://github.com/BenJooYT">by lieyabull</a>
    </footer>
  </div>
  <script src="units.js"></script>
  <script src="app.js"></script>
</body>
</html>
